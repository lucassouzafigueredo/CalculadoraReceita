name: Simulador RTC - pacote Windows

# Todo dia verifica se a calculadora oficial da Receita mudou. Se mudou (ou se o
# simulador mudou), monta o pacote, testa no Linux e no Windows e publica um Release.
# O lançador instalado nas máquinas consulta o último Release e se atualiza sozinho.
on:
  schedule:
    - cron: '17 9 * * *'   # 06:17 em Brasília
  workflow_dispatch:
    inputs:
      forcar:
        description: 'Publicar mesmo sem mudanças'
        type: boolean
        default: false
  push:
    paths:
      - 'web/**'
      - 'pacote/**'
      - 'scripts/**'
      - 'ferramentas/teste_rapido/**'
      - '.github/workflows/simulador-rtc.yml'

permissions:
  contents: write

concurrency:
  group: simulador-rtc
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    outputs:
      precisa: ${{ steps.v.outputs.precisa }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMIT=$(git ls-remote https://github.com/ReceitaFederal/calculadora-rtc-regime-regular.git refs/heads/main | cut -c1-7)
          HASH=$(git ls-tree HEAD web pacote scripts ferramentas/teste_rapido | sha1sum | cut -c1-7)
          echo "Calculadora oficial: $COMMIT | simulador: $HASH"
          if gh release list --limit 200 --json tagName -q '.[].tagName' | grep -q -- "-${COMMIT}-s${HASH}$" \
             && [ "${{ github.event.inputs.forcar }}" != "true" ]; then
            echo "Nada mudou desde o último pacote."
            echo "precisa=false" >> "$GITHUB_OUTPUT"
          else
            echo "precisa=true" >> "$GITHUB_OUTPUT"
          fi

  montar:
    needs: verificar
    if: needs.verificar.outputs.precisa == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versão do Java exigida pela calculadora oficial
        id: jv
        run: |
          JV=$(curl -sf https://raw.githubusercontent.com/ReceitaFederal/calculadora-rtc-regime-regular/main/pom.xml | sed -n 's:.*<java.version>\([0-9]*\)</java.version>.*:\1:p' | head -1)
          echo "Java exigido pela calculadora: ${JV:-21}"
          echo "versao=${JV:-21}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.jv.outputs.versao }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Testes de regras
        run: node scripts/teste_regras.js
      - name: Instalar Playwright (teste de tela)
        run: |
          cd scripts
          npm init -y > /dev/null
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Montar e testar pacote
        env:
          E2E: '1'
          NODE_PATH: ${{ github.workspace }}/scripts/node_modules
        run: scripts/montar_pacote.sh dist main
      - uses: actions/upload-artifact@v4
        with:
          name: pacote
          path: dist/
          retention-days: 7

  testar-windows:
    needs: montar
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pacote
          path: dist
      - name: Instalar e iniciar como um usuário faria
        shell: pwsh
        env:
          SIMULADOR_SEM_NAVEGADOR: '1'
        run: |
          Expand-Archive dist/Simulador-RTC-Windows.zip -DestinationPath C:\teste
          $cfg = Get-Content 'C:\teste\Simulador-RTC\config.json' -Raw | ConvertFrom-Json
          $cfg.verificar_atualizacao = $false
          $cfg | ConvertTo-Json | Set-Content 'C:\teste\Simulador-RTC\config.json'
          powershell -NoProfile -ExecutionPolicy Bypass -File 'C:\teste\Simulador-RTC\scripts\iniciar.ps1'
          if ($LASTEXITCODE -ne 0) { Get-Content C:\teste\Simulador-RTC\logs\* ; exit 1 }
          $html = Invoke-WebRequest -UseBasicParsing http://localhost:8765/api/simulador.html
          if ($html.Content -notmatch 'Simulador') { throw 'Tela não publicada' }
          $v = Invoke-RestMethod http://localhost:8765/api/calculadora/dados-abertos/versao
          Write-Host "Calculadora no Windows: $($v.versaoApp) / $($v.versaoDb)"
          powershell -NoProfile -ExecutionPolicy Bypass -File 'C:\teste\Simulador-RTC\scripts\encerrar.ps1'
      - name: Fechar a janela do simulador desliga a calculadora
        shell: pwsh
        run: |
          $url = 'http://localhost:8765/api/calculadora/dados-abertos/versao'
          $lancador = Start-Process powershell -PassThru -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File','C:\teste\Simulador-RTC\scripts\iniciar.ps1'
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) { Start-Sleep 2; try { Invoke-RestMethod $url -TimeoutSec 3 | Out-Null; $ok = $true; break } catch {} }
          if (-not $ok) { Get-Content C:\teste\Simulador-RTC\logs\*; throw 'Calculadora não subiu' }
          $perfil = 'C:\teste\Simulador-RTC\perfil-navegador'
          $nav = $null
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep 2
            $nav = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -and $_.CommandLine.Contains($perfil) }
            if ($nav) { break }
          }
          if (-not $nav) { throw 'Janela do simulador não abriu' }
          Write-Host "Navegador aberto: $(($nav | Select-Object -First 1).Name)"
          Start-Sleep 10
          # simula o usuário fechando a janela
          $nav | ForEach-Object { $gp = Get-Process -Id $_.ProcessId -ErrorAction SilentlyContinue; if ($gp) { $gp.CloseMainWindow() | Out-Null } }
          Start-Sleep 3
          Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -and $_.CommandLine.Contains($perfil) } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          $desligou = $false
          for ($i = 0; $i -lt 30; $i++) { Start-Sleep 2; try { Invoke-RestMethod $url -TimeoutSec 2 | Out-Null } catch { $desligou = $true; break } }
          if (-not $desligou) { throw 'A calculadora continuou ligada depois de fechar a janela' }
          if (-not $lancador.WaitForExit(30000)) { throw 'O lançador não terminou' }
          Write-Host 'OK: fechar a janela desligou a calculadora'
      - name: Java desatualizado é trocado sozinho pelo lançador
        shell: pwsh
        run: |
          $r = 'C:\teste\Simulador-RTC'
          New-Item -ItemType Directory -Force C:\fakerel | Out-Null
          Copy-Item dist\jre-windows-x64.zip C:\fakerel\
          '{"tag_name":"teste","assets":[{"name":"jre-windows-x64.zip","browser_download_url":"http://127.0.0.1:8777/jre-windows-x64.zip"}]}' | Set-Content C:\fakerel\latest.json
          $srv = Start-Process python -ArgumentList '-m','http.server','8777','--directory','C:\fakerel' -PassThru -WindowStyle Hidden
          Start-Sleep 3
          (Get-Content "$r\jre\release") -replace 'JAVA_VERSION="\d+', 'JAVA_VERSION="17' | Set-Content "$r\jre\release"
          $cfg = Get-Content "$r\config.json" -Raw | ConvertFrom-Json
          $cfg.verificar_atualizacao = $false
          $cfg.url_atualizacao = 'http://127.0.0.1:8777/latest.json'
          $cfg | ConvertTo-Json | Set-Content "$r\config.json"
          $env:SIMULADOR_SEM_NAVEGADOR = '1'
          powershell -NoProfile -ExecutionPolicy Bypass -File "$r\scripts\iniciar.ps1"
          if ($LASTEXITCODE -ne 0) { Get-Content "$r\logs\*"; throw 'O simulador não iniciou depois da troca do Java' }
          $versao = (Select-String -Path "$r\jre\release" -Pattern 'JAVA_VERSION="(\d+)').Matches[0].Groups[1].Value
          Write-Host "Java depois da troca: $versao"
          if ($versao -eq '17') { throw 'O Java não foi trocado' }
          powershell -NoProfile -ExecutionPolicy Bypass -File "$r\scripts\encerrar.ps1"
          Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue
          Write-Host 'OK: o lançador trocou o Java desatualizado'

  publicar:
    needs: [montar, testar-windows]
    # só publica a partir do branch principal; em outros branches o fluxo apenas monta e testa
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pacote
          path: dist
      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source dist/pacote.env
          {
            echo "Pacote do Simulador da Reforma Tributária montado com a calculadora oficial da Receita Federal."
            echo
            echo "**Primeira instalação:** baixe \`Simulador-RTC-Windows.zip\`, extraia e dê dois cliques em \`Iniciar Simulador.bat\`."
            echo "Quem já tem o simulador instalado recebe esta versão automaticamente ao abrir."
            echo
            echo "**Teste rápido (HTML único, sem instalar nada):** baixe \`teste_rapido_rtc.html\` e abra no navegador."
            echo
            echo '```json'; cat dist/versao.json; echo '```'
            echo
            echo "### Novidades da calculadora oficial"
            cat dist/notas.md
          } > dist/corpo.md
          gh release create "$PACOTE" dist/Simulador-RTC-Windows.zip dist/atualizacao-simulador-rtc.zip dist/versao.json dist/teste_rapido_rtc.html dist/site.zip dist/jre-windows-x64.zip \
            --title "Simulador RTC $PACOTE" --notes-file dist/corpo.md --target "$GITHUB_SHA" --latest

  # Publica no GitHub Pages: página inicial, teste rápido e simulador online:
  # https://<usuario>.github.io/<repositorio>/  — usa sempre o HTML do último Release.
  # Requer uma vez: Settings > Pages > Build and deployment > Source = "GitHub Actions".
  pages:
    needs: [verificar, publicar]
    if: >-
      always() && github.ref_name == github.event.repository.default_branch &&
      needs.verificar.result == 'success' &&
      (needs.publicar.result == 'success' || needs.publicar.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Baixar o site do último Release (página inicial, teste rápido e simulador online)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir site
          gh release download --repo "${{ github.repository }}" --pattern site.zip --dir .
          unzip -q site.zip -d site
          ls site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
